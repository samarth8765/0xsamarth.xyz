# /etc/nginx/sites-available/0xsamarth.xyz
#
# Enable it:
#   sudo ln -s /etc/nginx/sites-available/0xsamarth.xyz /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Add HTTPS once DNS points at the server:
#   sudo certbot --nginx -d 0xsamarth.xyz -d www.0xsamarth.xyz
#
# `root` must match the DEPLOY_PATH used by the deploy workflow. The workflow
# keeps `current` as a symlink to the newest release directory.
#
# nginx (www-data on Debian/Ubuntu) must be able to read the release and
# traverse every parent directory. If you see 403s, check `namei -l` on the
# current release path.

server {
    listen 80;
    listen [::]:80;
    server_name 0xsamarth.xyz www.0xsamarth.xyz;

    root /var/www/0xsamarth.xyz/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets never change, so cache them for a year.
    # (Uses `expires` rather than add_header so the headers above stay inherited.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html is revalidated every time, so a new deploy is visible at once.
    # `expires -1` sends Cache-Control: no-cache.
    location = /index.html {
        expires -1;
    }

    # SPA fallback so /blog/slug works on refresh and deep links.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
